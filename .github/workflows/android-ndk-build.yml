name: Build Ventura ARM64 Native Runtime APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: "26.3.11579264"
      CMAKE_VERSION: "3.22.1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake Components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "cmake;${CMAKE_VERSION}" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify C++20 Syntax and Headers
        run: |
          g++ -std=c++20 -fsyntax-only -Iapp/src/main/cpp/include \
            app/src/main/cpp/core/memory_arena.cpp \
            app/src/main/cpp/loader/pe32_loader.cpp \
            app/src/main/cpp/aot/x86_aot_engine.cpp \
            app/src/main/cpp/bridge/win32_bridge.cpp \
            app/src/main/cpp/bridge/winsock_samp_net.cpp \
            app/src/main/cpp/archive/img_ver2_reader.cpp

      - name: Build Debug APK (arm64-v8a + C++20 NDK)
        run: gradle :app:assembleDebug --stacktrace

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload Ventura ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ventura-arm64-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
